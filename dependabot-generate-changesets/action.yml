name: Generate changesets for Dependabot PRs
description: Add/update changeset files for Dependabot PR. Attributes by changed package.json manifests — one changeset per PR listing every affected workspace package as patch.

inputs:
  token:
    required: false
    description: 'GitHub token'
  pr-number:
    required: true
    description: 'Pull request number'

outputs:
  changesets-json:
    description: 'Json array of changeset files created or updated'
    value: ${{ steps.generate-changesets.outputs.changesets-json }}

runs:
  using: 'composite'
  steps:
    - id: generate-changesets
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
      run: |
        set -euo pipefail
        PR="${{ inputs.pr-number }}"
        OWNER_REPO="${{ github.repository }}"
        FILE=".changeset/~dependabot-pr-${PR}.md"

        # 1. Full pagination — gh pr view --json files caps at 100
        mapfile -t CHANGED < <(gh api --paginate "repos/${OWNER_REPO}/pulls/${PR}/files" --jq '.[].filename')

        # 2. Discover project packages from root package.json
        mapfile -t MEMBERS < <(node -e '
          const fs=require("fs"), path=require("path");
          const root=JSON.parse(fs.readFileSync("package.json","utf8"));
          const ws=root.workspaces?.packages||root.workspaces;
          const out=new Set();
          if (!ws || ws.length===0) {
            out.add(".");
          } else for (const g of ws) {
            if (g.endsWith("/*")) {
              const base=g.slice(0,-2);
              if (fs.existsSync(base)) for (const d of fs.readdirSync(base))
                if (fs.existsSync(path.join(base,d,"package.json"))) out.add(path.join(base,d));
            } else if (fs.existsSync(path.join(g,"package.json"))) out.add(g);
          }
          process.stdout.write([...out].join("\n"));
        ')

        # 3. Collect affected packages — no private filter
        AFFECTED=()
        for m in "${MEMBERS[@]}"; do
          manifest="$m/package.json"; manifest="${manifest#./}"
          printf '%s\n' "${CHANGED[@]}" | grep -qxF "$manifest" || continue
          AFFECTED+=("$(jq -r '.name' "$manifest")")
        done

        # 4. Nothing changed → delete stale changeset, emit none
        if [ ${#AFFECTED[@]} -eq 0 ]; then
          rm -f "$FILE"
          echo "changesets-json=[]" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # 5. One changeset for all affected packages
        {
          echo "---"
          for n in "${AFFECTED[@]}"; do echo "'$n': patch"; done
          echo "---"
          echo
          echo "dependabot: dependency updates for PR #${PR}"
        } > "$FILE"
        echo "changesets-json=[\"$FILE\"]" >> "$GITHUB_OUTPUT"
        npx --yes prettier --write "$FILE"
