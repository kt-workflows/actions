name: NPM Changesets Release
description: Prepare and execute the changesets release action

inputs:
  app-id:
    description: 'GitHub App ID used to create a token and submit changes'
  private-key:
    description: 'GitHub App private key used to create a token and submit changes'
  npm-token:
    description: 'NPM token used to publish the package (fallback if trusted publishing fails)'
  node-version:
    description: 'Concrete Node.js version to use'
  matrix-node-version:
    description: 'Node.js versions to use, json array like in matrix.node-version'
  matrix-node-version-earliest:
    description: 'Set this option if you want the action to select the earliest available version that satisfies the version spec.'
    default: 'false'
  install-script:
    description: 'Install script to run'
    default: npm ci
  skip-npm-setup:
    description: 'Skip Node.js setup and npm installation. This is useful if you have already set up Node.js environment in a previous step and want to avoid redundant setup.'
    default: 'false'
  build-script:
    description: 'Script to run to build the package'
    default: npm run build:release
  publish-script:
    description: 'Script to run to publish the package'
    default: npm run changeset:publish
  version-script:
    description: 'Script to run to version the package'
    default: npm run changeset:version
  cache-additional-path:
    description: 'Additional paths to cache. This is a multi-line list of paths.'
    default: |-
      /home/runner/.cache/Cypress
      /home/runner/.cache/ms-playwright
  cache-reset:
    description: 'Delete the cache if it exists to cache the new one.'
    default: 'false'
  checkout:
    description: 'Whether to checkout the repository before running the script. Set this to false if you have already checked out the repository in a previous step and want to avoid redundant checkout.'
    default: 'true'
  working-directory:
    description: 'The working directory which contains the **/package-lock.json files'
    default: '.'

outputs:
  release-branch:
    description: 'Branch name of the Changesets release PR'
    value: ${{ steps.release-branch.outputs.branch }}
  published:
    description: 'Whether published or not'
    value: ${{ steps.changesets.outputs.published == 'true' || steps.changesets-fallback.outputs.published == 'true' }}

runs:
  using: 'composite'
  steps:
    - id: app-token
      uses: kt-workflows/actions/create-github-app-token@main
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        configure-git: false
        default-to-github-token: true

    - uses: actions/checkout@v6
      if: ${{ inputs.checkout == 'true' }}
      with:
        # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}

    - uses: kt-workflows/actions/npm-run-script@main
      with:
        node-version: ${{ inputs.node-version }}
        matrix-node-version: ${{ inputs.matrix-node-version }}
        matrix-node-version-earliest: ${{ inputs.matrix-node-version-earliest }}
        skip-npm-setup: ${{ inputs.skip-npm-setup }}
        install-script: ${{ inputs.install-script }}
        run-script: ${{ inputs.build-script }}
        cache-additional-path: ${{ inputs.cache-additional-path }}
        cache-reset: ${{ inputs.cache-reset }}
        working-directory: ${{ inputs.working-directory }}

    # Ensure npm has recent trusted publishing fixes without downgrading future npm majors
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        current="$(npm -v)"
        echo "Current npm: $current"

        major="${current%%.*}"

        if [ "$major" -lt 12 ]; then
          npm install -g npm@11
        else
          echo "npm major $major detected; keeping bundled npm"
        fi

        echo "Final npm: $(npm -v)"

    # Step 1: Try trusted publishing first
    - id: changesets
      uses: changesets/action@v2
      with:
        publish-script: ${{ inputs.publish-script }}
        version-script: ${{ inputs.version-script }}
        create-github-releases: true
        cwd: ${{ inputs.working-directory }}
        github-token: ${{ steps.app-token.outputs.token }}
      env:
        NPM_CONFIG_PROVENANCE: true
      continue-on-error: true

    # Do not retry if the primary action reports partial publication.
    - if: ${{ steps.changesets.outcome == 'failure' && steps.changesets.outputs.published == 'true' }}
      shell: bash
      run: |
        echo "::error::Changesets reported published packages before failing. Refusing to retry publication with the fallback token."
        exit 1

    # Step 2: Configure npm token auth only for the fallback attempt.
    - id: npm-token-config
      if: ${{ steps.changesets.outcome == 'failure' && steps.changesets.outputs.published != 'true' }}
      shell: bash
      run: |
        umask 077
        fallback_npmrc="$RUNNER_TEMP/npm-release-fallback.npmrc"
        printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$fallback_npmrc"
        printf 'NPM_CONFIG_USERCONFIG=%s\n' "$fallback_npmrc" >> "$GITHUB_ENV"

    # Retry with the fallback npm token only when the primary action failed before reporting publication.
    - id: changesets-fallback
      if: ${{ steps.changesets.outcome == 'failure' && steps.changesets.outputs.published != 'true' }}
      uses: changesets/action@v2
      with:
        publish-script: ${{ inputs.publish-script }}
        version-script: ${{ inputs.version-script }}
        create-github-releases: true
        cwd: ${{ inputs.working-directory }}
        github-token: ${{ steps.app-token.outputs.token }}
      env:
        NPM_CONFIG_PROVENANCE: true
        NPM_TOKEN: ${{ inputs.npm-token }}

    # Get the branch of the pull request from its number
    - if: >-
        ${{
          steps.changesets.outputs.published != 'true' &&
          steps.changesets-fallback.outputs.published != 'true' &&
          (steps.changesets.outputs['has-changesets'] == 'true' || steps.changesets-fallback.outputs['has-changesets'] == 'true') &&
          (steps.changesets.outputs['pr-number'] != '' || steps.changesets-fallback.outputs['pr-number'] != '')
        }}
      id: release-branch
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        PR_NUMBER: ${{ steps.changesets-fallback.outputs['pr-number'] || steps.changesets.outputs['pr-number'] }}
      run: |
        pr_branch=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')
        echo "branch=$pr_branch" >> "$GITHUB_OUTPUT"
